# ---------------------------------------------------------------------------
# Athar Verify — full stack
#
#   cp .env.example .env    # then set AUTH_SECRET and IP_HASH_SALT
#   docker compose up -d
#   docker compose exec app npx prisma migrate deploy
#   docker compose exec app npx tsx prisma/seed.ts
#
# Redis and the worker are optional: with `REDIS_URL` unset the web container
# runs media jobs inline. Start them with the `queue` profile when you want
# durable, out-of-process media processing:
#
#   docker compose --profile queue up -d
# ---------------------------------------------------------------------------

name: athar-verify

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athar}
      POSTGRES_DB: ${POSTGRES_DB:-athar_verify}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-athar} -d $${POSTGRES_DB:-athar_verify}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published by default — nothing outside the compose network needs it.
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ['queue']
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - '6379'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-athar}:${POSTGRES_PASSWORD:-athar}@db:5432/${POSTGRES_DB:-athar_verify}?schema=public"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      PUBLIC_VERIFY_BASE_URL: ${PUBLIC_VERIFY_BASE_URL:-}
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET مطلوب. أنشئه بالأمر openssl rand -base64 48}"
      IP_HASH_SALT: "${IP_HASH_SALT:?IP_HASH_SALT مطلوب}"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /app/storage-data
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      REDIS_URL: ${REDIS_URL:-}
      AI_ANALYSIS_PROVIDER: ${AI_ANALYSIS_PROVIDER:-heuristic}
      AI_ANALYSIS_API_URL: ${AI_ANALYSIS_API_URL:-}
      AI_ANALYSIS_API_KEY: ${AI_ANALYSIS_API_KEY:-}
      FRAME_SAMPLE_COUNT: ${FRAME_SAMPLE_COUNT:-64}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      MAX_CUSTOMER_UPLOAD_BYTES: ${MAX_CUSTOMER_UPLOAD_BYTES:-314572800}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - storage-data:/app/storage-data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    profiles: ['queue']
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-athar}:${POSTGRES_PASSWORD:-athar}@db:5432/${POSTGRES_DB:-athar_verify}?schema=public"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET مطلوب}"
      IP_HASH_SALT: "${IP_HASH_SALT:?IP_HASH_SALT مطلوب}"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /app/storage-data
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      REDIS_URL: "redis://redis:6379"
      AI_ANALYSIS_PROVIDER: ${AI_ANALYSIS_PROVIDER:-heuristic}
      FRAME_SAMPLE_COUNT: ${FRAME_SAMPLE_COUNT:-64}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-2}
    volumes:
      - storage-data:/app/storage-data

volumes:
  db-data:
  redis-data:
  storage-data:
